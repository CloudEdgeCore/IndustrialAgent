server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Docker 内嵌 DNS。上游用**变量**引用，nginx 才会按 valid 周期重新解析 ——
    # 否则容器重建换了 IP 后会一直 502（nginx 只在启动时解析一次静态 upstream）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 后端 API：/api/xxx -> backend:8000/xxx
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 存活探针直通
    location /health {
        set $health_upstream http://backend:8000;
        proxy_pass $health_upstream/health;
    }

    # 前端（含 SSE / WebSocket 升级支持）
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
