[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-agent"
version = "0.1.0"
description = "基于大模型 Agent 的工业设备故障诊断与质量分析系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pyjwt>=2.8",
    "redis>=5.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "models*", "data*"]
exclude = ["apps*", "tests*", "docs*", "docker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
markers = [
    "integration: 需要 PostgreSQL + 已种子数据的测试（无数据库时自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent", "tools", "models", "data"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯例：Depends 出现在参数默认值中
"apps/api/app/api/*.py" = ["B008"]
