name: industrial-agent

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial} -d ${POSTGRES_DB:-industrial_agent}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-industrial}:${POSTGRES_PASSWORD:-industrial}@postgres:5432/${POSTGRES_DB:-industrial_agent}
      TOOL_DATABASE_URL: postgresql+psycopg://tool_ro:tool_ro@postgres:5432/${POSTGRES_DB:-industrial_agent}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./agent:/app/agent
      - ./tools:/app/tools
      - ./models:/app/models
      - ./data:/app/data
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "13000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  miniodata:
